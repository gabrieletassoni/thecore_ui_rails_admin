# Postgres only: every Thecore gem and host app targets PostgreSQL exclusively, so this dummy app
# never runs on SQLite. test/dummy/config/boot.rb rewrites DATABASE_URL (when set) to keep its
# server/credentials but always point at this gem's own thecore_ui_rails_admin_<env> database.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("PGHOST", "db") %>
  port: <%= ENV.fetch("PGPORT", 5432) %>
  username: <%= ENV.fetch("PGUSER", "postgres") %>
  password: <%= ENV.fetch("PGPASSWORD", "postgres") %>

development:
  <<: *default
  database: thecore_ui_rails_admin_development

test:
  <<: *default
  database: thecore_ui_rails_admin_test

production:
  <<: *default
  database: thecore_ui_rails_admin_production
